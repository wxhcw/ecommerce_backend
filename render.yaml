# Render 配置文件
# 此文件用于在 Render 上配置服务（可选）

services:
  - type: web
    name: ecommerce-backend
    runtime: docker
    plan: free  # 或 starter/standard/pro 根据需求选择
    region: oregon  # 选择你偏好的区域
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: JWT_SECRET
        sync: false  # 需要在 Render 控制台手动设置
      - key: STRIPE_SECRET_KEY
        sync: false  # 需要在 Render 控制台手动设置
      - key: STRIPE_WEBHOOK_SECRET_KEY
        sync: false  # 需要在 Render 控制台手动设置
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: ecommerce-db
          property: connectionString
    # 数据库配置（如果使用 Render 的 PostgreSQL）
    databases:
      - name: ecommerce-db
        plan: free  # 或 starter/standard/pro 根据需求选择
        databaseName: store_api
        user: postgres

